plugins {
    id 'com.android.application'
}

android {
    namespace 'net.adda.crosslandlauncher'
    compileSdk 34

    defaultConfig {
        applicationId "net.adda.crosslandlauncher"
        minSdk 26          // Android 8.0+ — covers every Carlinkit AI Box (they ship Android 9–15)
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
